# Pondhawk WAF recommended base configuration.
# Adapted from OWASP Coraza coraza.conf-recommended (Apache-2.0).
# Load this before crs-setup.conf and the CRS rules.

# Start in DetectionOnly. Switch to On after a tuning period with no false positives.
SecRuleEngine DetectionOnly

# -- Request body -------------------------------------------------------------
SecRequestBodyAccess On

# Select the body processor from the Content-Type.
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
     "id:'200006',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Reject requests whose URI cannot be parsed.
SecRule URI_PARSE_ERROR "@eq 1" \
    "id:'200009',phase:1,t:none,log,deny,status:400,msg:'URI failed to parse.'"

SecRequestBodyJsonDepthLimit 1024
SecArgumentsLimit 1000

# Maximum request body size (13 MiB). Larger bodies are rejected with 413.
SecRequestBodyLimit 13107200
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

# Reject bodies that the processor could not parse, so an unparsed body never reaches the application uninspected.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:'200002', phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

# Strict multipart validation (evasion through malformed multipart bodies).
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:'200003',phase:2,t:none,log,deny,status:400, \
    msg:'Multipart request body failed strict validation.', \
    logdata:'MULTIPART_DUPLICATE_PART_HEADER=%{MULTIPART_DUPLICATE_PART_HEADER}, \
    MULTIPART_INVALID_QUOTING=%{MULTIPART_INVALID_QUOTING}'"

# Reject requests over the arguments limit (parameter pollution, hash flooding).
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:'200004',phase:1,t:none,log,deny,status:400, \
    msg:'Argument limit reached; request rejected (GET/PATH args)'"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:'200005',phase:2,t:none,log,deny,status:400, \
    msg:'Argument limit reached; request rejected (POST args)'"

# -- Response body ---------------------------------------------------------------
# Inspect text responses for data leakage (SQL errors, stack traces, web shells). Responses of these MIME types
# are held in memory up to the limit before they are sent. Other responses stream through.
# JSON is added to Coraza's list because most ASP.NET Core applications answer (and leak errors) in JSON.
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json application/problem+json
SecResponseBodyLimit 524288
# Inspect the first 512 KiB of larger responses and send the rest uninspected.
SecResponseBodyLimitAction ProcessPartial

# -- Audit log ------------------------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:(5|4)(0|1)[0-9])$"
SecAuditLogParts ABIJDEFHZ
